auth:
  client_id_env: SALESFORCE_CLIENT_ID
  client_secret_env: SALESFORCE_CLIENT_SECRET
  username_env: SALESFORCE_USERNAME
  password_env: SALESFORCE_PASSWORD
  security_token_env: SALESFORCE_SECURITY_TOKEN
